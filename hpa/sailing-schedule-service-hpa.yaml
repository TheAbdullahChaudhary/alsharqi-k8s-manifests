apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sailing-schedule-service
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sailing-schedule-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
